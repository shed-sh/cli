name: Publish @shed-sh/skills

# Publish step of release.yml (wired in through publish-jobs in
# dist-workspace.toml). Packs the generated skill from skills/shed into
# @shed-sh/skills so `npx @shed-sh/skills` is the Node installer, matching
# `npx @shed-sh/shed` for the CLI. Needs NPM_TOKEN.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  skills-npm:
    name: Publish @shed-sh/skills
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        shell: bash
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          version="$(echo "$PLAN" | jq -r '.releases[0].app_version // empty')"
          if [[ -z "$version" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$version" ]]; then
            echo "No version could be resolved from the plan or the ref."
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Pack the skill into the npm package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          cp -R skills/shed packages/skills/skill
          cp LICENSE packages/skills/LICENSE
          cd packages/skills
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish
        working-directory: packages/skills
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
