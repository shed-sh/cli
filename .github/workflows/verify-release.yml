name: Verify release

# The one test that decides whether the installation experience actually
# works: install shed through the public paths against the release this tag
# produced, exactly as a user would. dist's release workflow uploads assets
# in parallel with this one, so early attempts may 404 — retry until the
# release is live rather than failing on the race.
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to verify (defaults to the pushed tag)
        required: false

permissions:
  contents: read

jobs:
  docs-current:
    name: The published docs must match the binary
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Generated documentation matches its registries
        shell: bash
        run: |
          go run ./cmd/shed-docs -check
          go test ./internal/docs

  verify-install:
    name: Verify the public install path
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          if [[ -z "$version" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          fi
          version="${version#v}"
          if [[ -z "$version" ]]; then
            echo "No version could be resolved from the pushed tag or input."
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Install shed through install-cli.sh
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          ok=""
          for attempt in $(seq 1 20); do
            if sh ./install-cli.sh --version "$VERSION" --bin-dir "$RUNNER_TEMP/bin"; then
              ok=1
              break
            fi
            echo "release assets not published yet (attempt $attempt); retrying in 30s"
            sleep 30
          done
          if [[ -z "$ok" ]]; then
            echo "the release assets never became installable"
            exit 1
          fi

      - name: The installed binary must report the released version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          got="$("$RUNNER_TEMP/bin/shed" version)"
          if [[ "$got" != "$VERSION" ]]; then
            echo "installed shed reports '$got', expected '$VERSION'"
            exit 1
          fi
          echo "shed $got installs cleanly from the public release"

      # npm is the second install channel users reach for (bun consumes the
      # same package). The registry publish runs in the parallel dist release
      # workflow, so retry through its latency too.
      - name: Install shed through npm
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          ok=""
          for attempt in $(seq 1 20); do
            if npm install --prefix "$RUNNER_TEMP/npm" "@shed-sh/shed@$VERSION"; then
              ok=1
              break
            fi
            echo "@shed-sh/shed@$VERSION not on the registry yet (attempt $attempt); retrying in 30s"
            sleep 30
          done
          if [[ -z "$ok" ]]; then
            echo "the npm package never became installable"
            exit 1
          fi
          got="$("$RUNNER_TEMP/npm/node_modules/.bin/shed" version)"
          if [[ "$got" != "$VERSION" ]]; then
            echo "npm-installed shed reports '$got', expected '$VERSION'"
            exit 1
          fi
          echo "shed $got installs cleanly from npm"
