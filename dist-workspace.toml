[workspace]
members = ["dist:."]

[package]
name = "shed"
version = "0.1.0"
# dist bakes this URL into the shell installer as the download location,
# so it must stay the repository releases land in.
repository = "https://github.com/shed-sh/cli"
description = "CLI for deploying and sharing small software"
homepage = "https://shed.codes"
binaries = ["shed"]
build-command = ["./dist-build.sh"]

[dist]
cargo-dist-version = "0.32.0"

# No source tarball: the repository itself is the source; duplicating it in
# every release only bloats the asset list.
source-tarball = false
ci = ["github"]
installers = ["shell", "npm"]

# Bare `shed` on npm belongs to someone else, so the package is scoped:
# `npx @shed-sh/shed` runs it, `npm install -g @shed-sh/shed` puts it on
# PATH (bun reads the same registry). Publishing needs an NPM_TOKEN
# secret for the shed-sh npm org.
npm-scope = "@shed-sh"

# One pipeline publishes the GitHub Release (which the curl installers
# read), the CLI npm package (`npx @shed-sh/shed`), and the skill npm
# package (`npx @shed-sh/skills`). release-smoke runs last and installs
# the published release the way a user would.
publish-jobs = ["npm", "./release-skills-npm"]
post-announce-jobs = ["./release-smoke"]

# Custom publish jobs default to contents: none. The skills npm job checks
# out this repository to pack skills/shed, so it needs contents: read.
github-custom-job-permissions = { "release-skills-npm" = { contents = "read", packages = "write", "id-token" = "write" } }

# Without this dist would install to $CARGO_HOME/bin, which is its Rust
# default and means nothing for a Go binary. This is the same precedence uv
# uses, and it keeps ~/.local/bin as the fallback so anyone who installed with
# the old script finds the binary in the place it already lived.
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]

# The installer configures PATH, so `shed login` works in the next shell
# without anyone editing a profile by hand. No backticks in this message: the
# installer expands it in a double-quoted shell string, so backticks would be
# executed as command substitution.
install-success-msg = "shed is installed! Run 'shed login' to connect it to your account."
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]

[dist.github-custom-runners]
global = "ubuntu-latest"
